<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Umair Shehzada</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      padding: 35px 30px;
      text-align: center;
    }
    .profile-img {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      margin: 0 auto 20px;
    }
    h1 {
      color: #fff;
      font-size: 1.9rem;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .bio {
      color: rgba(255, 255, 255, 0.75);
      font-size: 1rem;
      margin-bottom: 30px;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 15px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      text-decoration: none;
      border-radius: 14px;
      font-weight: 500;
      font-size: 1.05rem;
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .link-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }
    .link-btn i {
      font-size: 1.4rem;
      width: 28px;
    }
    .whatsapp:hover { background: #25D366; }
    .tiktok:hover { background: #000; }
    .facebook:hover { background: #1877F2; }
    .instagram:hover { background: #E4405F; }
    .linkedin:hover { background: #0A66C2; }
    .github:hover { background: #333; }
  </style>
</head>
<body>
  <div class="card">
    <!-- YAHAN APNI PIC LAGAO: umair.jpg naam se save karke is file ke saath rakho -->
    <img src="umair.jpg" alt="Umair Shehzada" class="profile-img">
    
    <h1>Umair Mehboob</h1>
    <p class="bio">Bahawalpur, Pakistan</p>
    
    <div class="links">
      <!-- 1. WhatsApp sabse upar - TUMHARA NUMBER DAAL DIYA -->
      <a href="https://wa.me/923096838964" target="_blank" class="link-btn whatsapp">
        <i class="fab fa-whatsapp"></i> WhatsApp
      </a>
      <!-- 2. TikTok -->
      <a href="https://www.tiktok.com/@umairshehzada15" target="_blank" class="link-btn tiktok">
        <i class="fab fa-tiktok"></i> TikTok
      </a>
      <!-- 3. Facebook -->
      <a href="https://www.facebook.com/share/1Apzhu2H73/" target="_blank" class="link-btn facebook">
        <i class="fab fa-facebook"></i> Facebook
      </a>
      <!-- 4. Instagram -->
      <a href="https://www.instagram.com/umairmahboob007" target="_blank" class="link-btn instagram">
        <i class="fab fa-instagram"></i> Instagram
      </a>
      <!-- 5. LinkedIn -->
      <a href="https://www.linkedin.com/in/umair-shehzada-b978a4406" target="_blank" class="link-btn linkedin">
        <i class="fab fa-linkedin"></i> LinkedIn
      </a>
      <!-- 6. GitHub -->
      <a href="https://github.com/mrumairmehboob" target="_blank" class="link-btn github">
        <i class="fab fa-github"></i> GitHub
      </a>
    </div>
  </div>
</body>
</html>
